name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node & Biome
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm format:check
      - run: cd frontend && pnpm lint
      - run: cd frontend && pnpm test

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python & Ruff
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: cd backend && uv sync --all-extras --dev
      - run: cd backend && uv run ruff check .
      - run: cd backend && uv run pytest tests/

      # ENTERPRISE INTEGRATION: Dynamic Neon DB Branching & RAGAS Evaluations
      - name: Create Neon DB Branch for Integration Testing & Sync to Vercel
        if: github.event_name == 'pull_request' && secrets.NEON_API_KEY != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx @neondatabase/api-cli vercel
          # Create transient branch from main
          BRANCH_DATA=$(neon branches create --project-id $NEON_PROJECT_ID --name pr-${{ github.event.number }} --output json)
          CONN_STR=$(echo $BRANCH_DATA | jq -r '.connection_uri')
          echo "DATABASE_URL=$CONN_STR" >> $GITHUB_ENV
          
          # Dynamic Vercel Sync: Inject branch DB URL into this specific Vercel PR Environment
          vercel env add DATABASE_URL "$CONN_STR" preview git-${{ github.head_ref }} --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID --yes
          
          # Run RAGAS and LangSmith evaluations
          cd backend && uv run pytest tests/test_rag.py

      - name: Delete Neon DB Branch
        if: always() && github.event_name == 'pull_request' && secrets.NEON_API_KEY != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          neon branches delete pr-${{ github.event.number }} --project-id $NEON_PROJECT_ID --force
