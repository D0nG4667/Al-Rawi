name: Al-Rawi Continuous Integration & Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI (Python / FastAPI / Ruff / Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        run: |
          cd backend
          uv sync --all-extras --dev

      - name: Run Ruff Code Quality Checks
        run: |
          cd backend
          uv run ruff check .
          uv run ruff format --check .

      - name: Execute Pytest Suite
        run: |
          cd backend
          uv run pytest tests/

  frontend-ci:
    name: Frontend CI (Node / Next.js / Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Run Biome Lints & Formats
        run: |
          cd frontend
          pnpm format
          pnpm lint

      - name: Build Production Next.js Bundle
        run: |
          cd frontend
          pnpm build
