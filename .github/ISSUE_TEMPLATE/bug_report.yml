name: Bug report
description: Something in Al-Rawi is broken or behaves unexpectedly
title: "fix: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Al-Rawi. Please never paste API keys or other secrets.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend (3D canvas / UI)
        - Oracle chat / RAG
        - Majlis podcast / audio
        - Mind map
        - Document ingestion
        - Admin dashboard
        - CI/CD / tooling
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the steps to reproduce and what you expected instead.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: dropdown
    id: locale
    attributes:
      label: Locale
      options: [English (LTR), Arabic (RTL), Both]
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Chrome 130 on Windows 11 / Safari iOS 18 / local dev"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
