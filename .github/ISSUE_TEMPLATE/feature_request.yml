name: Feature request
description: Propose a new capability or improvement for Al-Rawi
title: "feat: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user (traveler, historian, admin) is affected and what is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Considerations
      options:
        - label: Needs Arabic (RTL) and English copy
        - label: Affects the 3D canvas / performance budget
        - label: Requires backend API changes
